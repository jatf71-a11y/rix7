# Sonda de salud de producción (plan fase 3, ítem 3.7).
#
# `/api/health` sabe decir qué subsistemas quedaron sin configurar en un
# despliegue, pero nadie lo mira por su cuenta. Este workflow lo consulta cada
# pocas horas y se pone **rojo** cuando falta algo **crítico**: el proyecto
# Supabase real (sin él el portal acepta altas pero no guarda nada) o —el otro
# crítico— que la base **no sea la de la cuenta dueña del proyecto**, que es el
# estado en el que el incidente del 2026-10-13 pasó inadvertido: todo respondía,
# y lo que estaba mal era de quién era la base.
#
# También contesta la otra pregunta que este repo se hizo dos veces "de más":
# **¿lo que está en vivo es el código del repositorio?** El despliegue publica el
# hash del árbol con el que se construyó (`RIX7_BUILD`) y la sonda lo compara con
# el de este checkout. No coincidir NO pone el job rojo —que producción vaya unos
# commits atrás es una situación normal, no una caída— pero queda en el resumen,
# que es donde se mira cuando alguien pregunta por qué una función "no está".
#
# Por qué no está dentro de `ci.yml`: `ci.yml` corre en cada push y valida el
# código del repo; esto vigila un despliegue **ya desplegado**, así que su
# disparador es el reloj, no el commit. Son dos preguntas distintas.
#
# Degradados y opcionales (Resend, clave de servicio, Sentry, URL canónica) NO
# hacen fallar el job: se reportan en el resumen. Un job que se pone rojo por
# algo que no rompe nada se aprende a ignorar, y entonces deja de avisar de lo
# que sí importa.
#
# Requisitos: ninguno. `/api/health` es público y no expone valores. Opcional: la
# variable de repositorio `HEALTH_URL` (Settings → Secrets and variables →
# Actions → Variables) para apuntar a otro despliegue; sin ella se usa el alias
# de producción de Vercel.
#
# Además consulta el **esquema** de la base (`scripts/check-schema.mjs`): que el
# código desplegado encuentre las columnas y funciones que usa. Es la única
# comprobación que puede ponerse roja sin que nadie toque nada —una migración a
# medio aplicar, o un proyecto de Supabase recreado— y avisa en horas en vez de
# cuando alguien se topa con el error usando el portal. Para que corra, hay que
# definir en Settings → Secrets and variables → Actions:
#
#   · Variable  NEXT_PUBLIC_SUPABASE_URL   (la URL del proyecto; es pública)
#   · Secreto   NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# Las dos salen en el bundle del navegador, así que no son credenciales de
# poder: se usan acá solo para leer. Sin la variable, el paso se saltea y lo
# dice; no se marca rojo por algo que no está configurado.
#
# Y cuando queda rojo, **avisa en un issue** (`scripts/notice-health.mjs`): un job
# rojo hay que ir a mirarlo, y un issue aparece en el feed, manda correo y guarda
# el motivo con su fecha. Es un solo issue, siempre el mismo: se abre cuando la
# sonda queda roja, se refresca en cada corrida roja, comenta solo si el motivo
# cambió y se cierra solo cuando vuelve a estar verde.
#
# Nota: GitHub desactiva los schedules tras 60 días sin actividad en el repo.

name: Salud de producción

on:
  schedule:
    # Cada 6 horas (00, 06, 12 y 18 UTC). Barato: una petición sin dependencias.
    - cron: '0 */6 * * *'
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read # el checkout, para comparar el identificador de la build
  issues: write # abrir, actualizar y cerrar el aviso de salud

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    name: GET /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: la sonda no se queda en "los commits difieren",
          # cuenta cuántos commits va producción atrás (`git rev-list --count`), y
          # con el clon de un solo commit eso no se puede calcular.
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # El script solo usa módulos de Node (fetch, fs): no hace falta `npm ci`.
      # El resumen de la corrida lo escribe él mismo vía GITHUB_STEP_SUMMARY, y
      # un fallo deja `::error::` con el primer motivo, para no tener que abrir
      # el log.
      - name: Consultar la salud del despliegue
        id: salud
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://rix7.vercel.app' }}
        # `pipefail` para que el paso siga fallando cuando la sonda falla: sin él
        # el estado del paso sería el de `tee`, y el job quedaría verde con la
        # sonda en rojo. Lo que sale por acá es lo que después se pega en el
        # issue, así que el informe tiene que quedar en el archivo **y** en el log.
        run: |
          set -o pipefail
          node scripts/check-health.mjs 2>&1 | tee "$RUNNER_TEMP/salud.txt"

      # El esquema, contra la base real. Se saltea —diciéndolo— cuando el
      # repositorio todavía no tiene las dos claves públicas: un job rojo por
      # algo que no está configurado es un job que se aprende a ignorar.
      - name: Avisar si faltan las claves para sondear el esquema
        if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL == '' }}
        run: |
          echo '::notice::Sin la variable NEXT_PUBLIC_SUPABASE_URL no se comprueba el esquema de la base.'
          echo 'Definila en Settings → Secrets and variables → Actions (Variables) junto al secreto' >> "$GITHUB_STEP_SUMMARY"
          echo '`NEXT_PUBLIC_SUPABASE_ANON_KEY` para que esta comprobación corra.' >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar el esquema de la base
        id: esquema
        if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          node scripts/check-schema.mjs 2>&1 | tee "$RUNNER_TEMP/esquema.txt"

      # El aviso va al final y con `if: always()`: tiene que correr tanto si algo
      # falló —para abrir o refrescar el issue— como si todo salió bien —para
      # cerrarlo. Los dos `outcome` son el dato con el que decide; si no llegan,
      # el script se niega a actuar en vez de suponer que está todo bien.
      - name: Avisar en el issue de salud
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AVISO_DIR: ${{ runner.temp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SALUD_FALLO: ${{ steps.salud.outcome == 'failure' }}
          ESQUEMA_FALLO: ${{ steps.esquema.outcome == 'failure' }}
        run: node scripts/notice-health.mjs
