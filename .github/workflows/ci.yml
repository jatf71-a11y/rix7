# CI de Rix7 (hallazgo #7 de la fase 2; endurecido en fase 3, ítems 1.2–1.3).
#
# Antes de este workflow no existía ninguna verificación automática al pushear:
# un test rojo o un error de tipos llegaba a producción si nadie corría la
# suite a mano. Acá se ejecuta la misma tríada que en local, de menor a mayor
# costo: tipos → tests → knip → build → budget.
#
# Ítem 1.2: knip se suma como paso bloqueante. El guard CSP ya corre dentro
# de `vitest` (`lib/utils/cspCoverage.test.ts`), así que con el paso de tests
# queda cubierto — si un host sin permiso entra al código, ese test rompe el
# CI. Lo que este workflow añade es la detección de dependencias, archivos y
# exports muertos (`npx knip`), que antes solo se corría a mano en auditorías.
#
# Ítem 1.3: performance budget. La build deja `.next/` en el workspace del job
# `verify` y un job separado — `if: always()` — compara el First Load JS real
# contra `scripts/bundle-baseline.json` (el manifest y los chunks viajan por
# artifact, porque no comparten workspace). Separado a propósito: si el budget
# falla, el log del build sigue visible, y un build roto también marca rojo
# este paso en vez de esconderse.
#
# Ítem 3.3: auditoría de accesibilidad como puerta bloqueante. El job `a11y`
# levanta la build del PR con `next start` y corre axe-core en un Chrome real
# contra las rutas que representan cada plantilla, con `--fail-on-serious`:
# si alguna tiene hallazgos critical/serious, el CI se pone rojo. Mismo
# patrón que knip/budget — barato de mantener, imposible de esquivar.
#
# Guardia de secretos: un job propio, sin dependencias y primero, que falla si
# un `.env*` (salvo `.env.example`) quedó versionado o si el árbol contiene un
# token de Supabase (`sbp_`, `sb_secret_`, un JWT `service_role`), de Resend, de
# GitHub, de Stripe, de Google o de Sentry, o un bloque de clave privada PEM.
# Nació de la puesta en marcha de Supabase real: convierte en regla que un
# secreto no llegue al repositorio, en vez de depender de no equivocarse.
#
# Integración sin Supabase: la única puerta que mide **comportamiento** y no
# código. `npm run test:integration:nosupabase` copia el repo a una carpeta
# temporal sin `.env*`, **compila ahí** su propia build y arranca `next start`
# con las `NEXT_PUBLIC_SUPABASE_*` fuera de los bundles, para que el portal
# degrade de verdad en vez de simularlo. 15 comprobaciones de punta a punta
# (salud, favoritos, búsquedas guardadas, contactos, visitas de ficha) con
# criterio fail-closed: un 200 con datos sin sesión hace fallar el job.
#
# Es un job **independiente** —sin `needs` y sin artifact— y construye lo suyo
# a propósito: bajar la `.next` del job `verify` sería volver al bug que este
# gate arregló, porque esa build trae las `NEXT_PUBLIC_*` inlineadas y el
# portal seguiría conectado. Su coste es un `next build` (~3 min) más el install.
#
# Sin secretos a propósito: el portal está diseñado para degradar a catálogo
# local cuando Supabase no está configurado, así que el build no necesita
# claves. Si algún día una variable fuera imprescindible, usar Variables (no
# secretos) del repo y documentarlo acá — nunca copiar claves reales a GitHub.
#
# Estado del dominio: `npm run check:domain` en un job propio, en cada
# corrida. Deja los nueve pasos del plan de rix7.cl (§8.4 del runbook de
# Resend) en el resumen de la corrida y el paso en el que se queda como
# anotación `::warning::`. Informativo: mientras el plan siga pendiente
# —hoy, delegar los NS en NIC Chile— el exit 1 es el estado esperado, no un
# fallo del código, así que el job solo se pone rojo si el script falla
# (exit ≥ 2). Misma regla que la sonda de salud: un CI rojo por algo que no
# rompe nada se aprende a ignorar. Corre sin `npm ci` (el script solo usa
# módulos de Node) y con `--no-env`: en CI no hay sesión de Vercel y la
# regla del repo es no copiar claves allá.
#
# Node 24 sobre debian: es la línea que corre Vercel (20.x quedó discontinuada
# y su build falla con «Node.js Version "20.x" is discontinued») y la misma que
# usa el equipo en local. Con `cache: npm` el lockfile acelera el install;
# `npm ci` garantiza installs reproducibles.

name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

# Cancela la corrida anterior de la misma rama: ahorra minutos cuando se
# empujan correcciones seguidas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primero y sin dependencias (solo node + git): un token filtrado se ve en
  # segundos, antes de gastar minutos instalando y compilando.
  secrets:
    name: Sin secretos en el árbol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Buscar secretos
        run: npm run check:secrets

  verify:
    name: Tipos, tests, knip y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests (vitest, incluye el guard de CSP)
        run: npx vitest run

      # Ítem 1.2: dependencias, archivos y exports muertos como error — no aviso.
      # La config vive en knip.json, con los falsos positivos documentados ahí.
      - name: Código muerto (knip)
        run: npm run check:knip

      - name: Build (next build)
        run: npm run build

      # La build completa para los dos jobs descendientes: el budget solo usa
      # el manifest + chunks, y el job a11y necesita un `.next/` completo para
      # `next start` (server files, HTML prerenderizado, rutas). Se excluye
      # `.next/cache` (webpack): pesa cientos de MB y nadie descendiente lo usa.
      - name: Guardar build (budget + auditoría a11y)
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/**
            !.next/cache/**
          retention-days: 1
          if-no-files-found: error
          # upload-artifact v4 (desde 4.4) excluye los archivos ocultos por
          # defecto, y `.next/` empieza con punto: sin esto el paso falla con
          # «No files were found with the provided path: .next/**» y los jobs
          # budget y a11y mueren con «Artifact not found», aunque la build
          # haya terminado bien.
          include-hidden-files: true

  budget:
    name: Performance budget (First Load JS)
    runs-on: ubuntu-latest
    needs: verify
    if: always() # corre aunque verify falle: un build roto se ve en ambos lados
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # El script solo usa node:fs/zlib: no necesita instalar dependencias.

      - name: Bajar la build del job verify
        uses: actions/download-artifact@v4
        with:
          name: next-build
          # upload-artifact v4 elimina el ancestro común de los paths subidos
          # (`.next/`): el artifact trae `app-build-manifest.json` y
          # `static/**` en la raíz. Descargando acá se reconstruye `.next/`.
          path: .next

      - name: Comparar contra scripts/bundle-baseline.json
        run: npm run check:bundle

  # Ítem 3.3 (fase 3): accesibilidad bloqueante, igual que los tipos o el budget.
  # `ubuntu-latest` trae Chrome estable preinstalado en /usr/bin/google-chrome,
  # que es el primer candidato de `findChrome` en el script — no hace falta
  # instalar un navegador. El script precalienta cada ruta antes de inyectar
  # axe, así que no hay ruido de compilación: contra `next start` mide lo mismo
  # que verá el usuario.
  a11y:
    name: Accesibilidad (axe-core, fail on serious)
    runs-on: ubuntu-latest
    needs: verify
    if: always() # corre aunque verify falle: un build roto se ve en ambos lados
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Bajar la build del job verify
        uses: actions/download-artifact@v4
        with:
          name: next-build
          # upload-artifact v4 elimina el ancestro común (`.next/`): descargar
          # acá reconstruye `.next/` completo, igual que hace el job budget.
          path: .next

      # Node 24 ya trae el `WebSocket` global (estable desde 22) que usa la
      # conexión CDP: no hace falta `--experimental-websocket`. El script avisa
      # con un mensaje claro si alguna vez se corre con una major anterior.
      - name: Levantar la build y auditar
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run check:a11y -- --fail-on-serious

  # Comportamiento, no solo tipos: ¿qué ve una persona cuando el portal no tiene
  # Supabase? Sin `needs` ni artifact: la suite compila su propia build sin
  # `.env*` (ver cabecera), que es justo lo que hay que probar, y no pide un
  # `npm run build` previo — la build de la raíz sería la equivocada.
  integration:
    name: Integración sin Supabase (degrada sin filtrar datos)
    runs-on: ubuntu-latest
    # Un `next build` colgado no debería quemar horas de Actions: la suite ya
    # espera 120 s a que el servidor escuche, el techo es para la compilación.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Suite sin Supabase (compila en su copia temporal)
        run: npm run test:integration:nosupabase

  # El estado del dominio no puede poner el CI en rojo mientras el plan siga
  # pendiente: el exit 1 significa «quedan pasos manuales», no «algo se rompió».
  # Por eso el paso mapea 1 → 0 (el aviso ya lo imprime el propio script como
  # `::warning::` y el detalle queda en el resumen de la corrida) y solo deja
  # pasar el ≥2, que sí es un fallo del script. Cuando el plan esté completo
  # (todas las corridas den 0), el mapeo se puede quitar para convertirlo en
  # gate: cualquier regresión —NS caídos, canonical viejo— ahí sí rompe.
  domain:
    name: Estado del dominio (check:domain)
    runs-on: ubuntu-latest
    # El script tiene sus propios timeouts (DNS 10 s, HTTP 12 s, smoke 240 s):
    # el techo es para que una corrida colgada no quemar horas de Actions.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Sin `npm ci`: ni el script ni el `smoke:prod` que invoca usan
      # dependencias externas, y `gh` viene en el runner. `GH_TOKEN` con el
      # token de la corrida es lo que lee `vars.SITE_URL` (paso 6); si los
      # permisos no alcanzan, ese control sale como ○ manual sin tumbar nada.
      - name: Recorrer los 9 pasos del plan del dominio (§8.4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          npm run check:domain -- --no-env || code=$?
          # exit 1 = «el plan sigue pendiente» (estado esperado mientras queden
          # pasos manuales): no rompe la corrida. exit ≥2 = el script falló.
          if [ "$code" -ge 2 ]; then
            echo "::error::check:domain falló (exit ${code}) — es el script, no el plan"
            exit "$code"
          fi
          echo "Plan del dominio: exit ${code} (0 = al día, 1 = pendiente) — detalle en el resumen de la corrida"
